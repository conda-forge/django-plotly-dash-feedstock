# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.5.1"

package:
  name: django-plotly-dash
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/django-plotly-dash/django_plotly_dash-${{ version }}.tar.gz
  sha256: fde84f641526c22029e7702ed4684db9e31ca2bdef888f520de531abf891f58e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - plotly
    - dash >=2.0
    - dpd_components >=0.2.0
    - dash-bootstrap-components
    - channels >=4.0
    - django >=4.0.0
    - flask >=1.0.2
    - werkzeug

tests:
  - python:
      imports:
        - django_plotly_dash
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/GibbsConsulting/django-plotly-dash
  license: MIT
  license_file: LICENSE
  summary: Django use of plotly dash apps through template tags
  description: |
    Django use of plotly dash apps through template tags
  repository: https://github.com/GibbsConsulting/django-plotly-dash
  documentation: http://django-plotly-dash.readthedocs.io/

extra:
  recipe-maintainers:
    - rxm7706
